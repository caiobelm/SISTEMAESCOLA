version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistemaescola
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - db
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sistemaescola?schema=public
    ports:
      - '3333:3333'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    env_file: .env.example
    environment:
      NEXT_PUBLIC_API_URL: http://api:3333
    ports:
      - '3000:3000'

volumes:
  postgres-data:
